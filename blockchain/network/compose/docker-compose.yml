name: yen-sao-fabric

services:
  ca-harvest:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-harvest
      FABRIC_CA_SERVER_CSR_CN: ca-harvest
      FABRIC_CA_SERVER_CSR_HOSTS: ca-harvest,localhost
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      CA_BOOTSTRAP_PASSWORD: ${CA_HARVEST_BOOTSTRAP_PASSWORD:?Set CA_HARVEST_BOOTSTRAP_PASSWORD in .env}
      FABRIC_CA_CLIENT_HOME: /var/hyperledger/fabric-ca/clients/admin
    command: ["sh", "-c", "fabric-ca-server start -b admin:$$CA_BOOTSTRAP_PASSWORD -d"]
    volumes:
      - ca-harvest-data:/etc/hyperledger/fabric-ca-server
      - ./blockchain/organizations/ca-clients/harvest:/var/hyperledger/fabric-ca/clients
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-client getcainfo -u https://localhost:7054 --tls.certfiles /etc/hyperledger/fabric-ca-server/ca-cert.pem >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - fabric-network

  ca-processing:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-processing
      FABRIC_CA_SERVER_CSR_CN: ca-processing
      FABRIC_CA_SERVER_CSR_HOSTS: ca-processing,localhost
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      CA_BOOTSTRAP_PASSWORD: ${CA_PROCESSING_BOOTSTRAP_PASSWORD:?Set CA_PROCESSING_BOOTSTRAP_PASSWORD in .env}
      FABRIC_CA_CLIENT_HOME: /var/hyperledger/fabric-ca/clients/admin
    command: ["sh", "-c", "fabric-ca-server start -b admin:$$CA_BOOTSTRAP_PASSWORD -d"]
    volumes:
      - ca-processing-data:/etc/hyperledger/fabric-ca-server
      - ./blockchain/organizations/ca-clients/processing:/var/hyperledger/fabric-ca/clients
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-client getcainfo -u https://localhost:7054 --tls.certfiles /etc/hyperledger/fabric-ca-server/ca-cert.pem >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - fabric-network

  ca-distribution:
    image: hyperledger/fabric-ca:1.5.17
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-distribution
      FABRIC_CA_SERVER_CSR_CN: ca-distribution
      FABRIC_CA_SERVER_CSR_HOSTS: ca-distribution,localhost
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      CA_BOOTSTRAP_PASSWORD: ${CA_DISTRIBUTION_BOOTSTRAP_PASSWORD:?Set CA_DISTRIBUTION_BOOTSTRAP_PASSWORD in .env}
      FABRIC_CA_CLIENT_HOME: /var/hyperledger/fabric-ca/clients/admin
    command: ["sh", "-c", "fabric-ca-server start -b admin:$$CA_BOOTSTRAP_PASSWORD -d"]
    volumes:
      - ca-distribution-data:/etc/hyperledger/fabric-ca-server
      - ./blockchain/organizations/ca-clients/distribution:/var/hyperledger/fabric-ca/clients
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-client getcainfo -u https://localhost:7054 --tls.certfiles /etc/hyperledger/fabric-ca-server/ca-cert.pem >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - fabric-network

  orderer0:
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTAUTHREQUIRED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    command: orderer
    volumes:
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/msp:/var/hyperledger/orderer/msp
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/tls:/var/hyperledger/orderer/tls:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - orderer0-data:/var/hyperledger/production/orderer
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/7053"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - orderer0.example.com

  orderer1:
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "8050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTAUTHREQUIRED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    command: orderer
    volumes:
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/msp:/var/hyperledger/orderer/msp
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls:/var/hyperledger/orderer/tls:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - orderer1-data:/var/hyperledger/production/orderer
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/7053"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - orderer1.example.com

  orderer2:
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "9050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTAUTHREQUIRED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    command: orderer
    volumes:
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/msp:/var/hyperledger/orderer/msp
      - ./blockchain/organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls:/var/hyperledger/orderer/tls:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - orderer2-data:/var/hyperledger/production/orderer
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/7053"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - orderer2.example.com

  peer-harvest:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.org-harvest.example.com
      CORE_PEER_ADDRESS: peer0.org-harvest.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org-harvest.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org-harvest.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org-harvest.example.com:7051
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_LOCALMSPID: OrgHarvestMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: yen-sao-fabric-network
      CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_CHAINCODE_EXECUTETIMEOUT: 300s
      CORE_CHAINCODE_BUILDER: hyperledger/fabric-ccenv:2.5.16
      CORE_CHAINCODE_NODE_RUNTIME: hyperledger/fabric-nodeenv:2.5
      CORE_CHAINCODE_STARTUPTIMEOUT: 300s
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    command: peer node start
    volumes:
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-harvest.example.com/peers/peer0.org-harvest.example.com:/etc/hyperledger/fabric
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-harvest.example.com/users/Admin@org-harvest.example.com/msp:/etc/hyperledger/fabric/admin/msp:ro
      - ./blockchain/network/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-harvest-data:/var/hyperledger/production
    healthcheck:
      test: ["CMD-SHELL", "peer channel list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - peer0.org-harvest.example.com

  peer-processing:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.org-processing.example.com
      CORE_PEER_ADDRESS: peer0.org-processing.example.com:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.org-processing.example.com:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org-processing.example.com:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org-processing.example.com:8051
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_LOCALMSPID: OrgProcessingMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: yen-sao-fabric-network
      CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_CHAINCODE_EXECUTETIMEOUT: 300s
      CORE_CHAINCODE_BUILDER: hyperledger/fabric-ccenv:2.5.16
      CORE_CHAINCODE_NODE_RUNTIME: hyperledger/fabric-nodeenv:2.5
      CORE_CHAINCODE_STARTUPTIMEOUT: 300s
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    command: peer node start
    volumes:
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-processing.example.com/peers/peer0.org-processing.example.com:/etc/hyperledger/fabric
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-processing.example.com/users/Admin@org-processing.example.com/msp:/etc/hyperledger/fabric/admin/msp:ro
      - ./blockchain/network/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-processing-data:/var/hyperledger/production
    healthcheck:
      test: ["CMD-SHELL", "peer channel list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - peer0.org-processing.example.com

  peer-distribution:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.org-distribution.example.com
      CORE_PEER_ADDRESS: peer0.org-distribution.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org-distribution.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org-distribution.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org-distribution.example.com:9051
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_LOCALMSPID: OrgDistributionMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: yen-sao-fabric-network
      CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_CHAINCODE_EXECUTETIMEOUT: 300s
      CORE_CHAINCODE_BUILDER: hyperledger/fabric-ccenv:2.5.16
      CORE_CHAINCODE_NODE_RUNTIME: hyperledger/fabric-nodeenv:2.5
      CORE_CHAINCODE_STARTUPTIMEOUT: 300s
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    command: peer node start
    volumes:
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-distribution.example.com/peers/peer0.org-distribution.example.com:/etc/hyperledger/fabric
      - ./blockchain/organizations/crypto-config/peerOrganizations/org-distribution.example.com/users/Admin@org-distribution.example.com/msp:/etc/hyperledger/fabric/admin/msp:ro
      - ./blockchain/network/config/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - ./blockchain/network/channel-artifacts:/var/hyperledger/configtx:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-distribution-data:/var/hyperledger/production
    healthcheck:
      test: ["CMD-SHELL", "peer channel list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      fabric-network:
        aliases:
          - peer0.org-distribution.example.com

volumes:
  ca-harvest-data:
  ca-processing-data:
  ca-distribution-data:
  orderer0-data:
  orderer1-data:
  orderer2-data:
  peer-harvest-data:
  peer-processing-data:
  peer-distribution-data:

networks:
  fabric-network:
    name: yen-sao-fabric-network
    driver: bridge
    internal: true
