Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../../organizations/crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer0.example.com:7050
      - orderer1.example.com:8050
      - orderer2.example.com:9050

  - &OrgHarvest
    Name: OrgHarvest
    ID: OrgHarvestMSP
    MSPDir: ../../organizations/crypto-config/peerOrganizations/org-harvest.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgHarvestMSP.admin', 'OrgHarvestMSP.peer', 'OrgHarvestMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgHarvestMSP.admin', 'OrgHarvestMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgHarvestMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgHarvestMSP.peer')"
    AnchorPeers:
      - Host: peer0.org-harvest.example.com
        Port: 7051

  - &OrgProcessing
    Name: OrgProcessing
    ID: OrgProcessingMSP
    MSPDir: ../../organizations/crypto-config/peerOrganizations/org-processing.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgProcessingMSP.admin', 'OrgProcessingMSP.peer', 'OrgProcessingMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgProcessingMSP.admin', 'OrgProcessingMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgProcessingMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgProcessingMSP.peer')"
    AnchorPeers:
      - Host: peer0.org-processing.example.com
        Port: 8051

  - &OrgDistribution
    Name: OrgDistribution
    ID: OrgDistributionMSP
    MSPDir: ../../organizations/crypto-config/peerOrganizations/org-distribution.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgDistributionMSP.admin', 'OrgDistributionMSP.peer', 'OrgDistributionMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgDistributionMSP.admin', 'OrgDistributionMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgDistributionMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgDistributionMSP.peer')"
    AnchorPeers:
      - Host: peer0.org-distribution.example.com
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  Addresses:
    - orderer0.example.com:7050
    - orderer1.example.com:8050
    - orderer2.example.com:9050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ThreeOrgsRaft:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      OrdererType: etcdraft
      EtcdRaft:
        Consenters:
          - Host: orderer0.example.com
            Port: 7050
            ClientTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt
            ServerTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt
          - Host: orderer1.example.com
            Port: 8050
            ClientTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
            ServerTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
          - Host: orderer2.example.com
            Port: 9050
            ClientTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
            ServerTLSCert: ../../organizations/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *OrgHarvest
        - *OrgProcessing
        - *OrgDistribution
      Capabilities:
        <<: *ApplicationCapabilities
